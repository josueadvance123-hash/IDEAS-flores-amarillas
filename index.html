<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Feliz Día de las Flores Amarillas</title>
<style>
/* ============================
   VARIABLES DE COLOR (fácil de cambiar)
   ============================ */
:root{
  --bg1:#05060f;
  --bg2:#0d0a1a;
  --gold:#ffd36b;
  --gold-soft:#ffe9b0;
  --gold-deep:#e8a13a;
  --glow:#ffcf70;
  --text-light:#f3e8cf;
  --card-bg:#231708ee;
  --card-border:#7a5a2a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:radial-gradient(ellipse at 50% 55%, var(--bg2), var(--bg1) 70%);
  overflow:hidden; touch-action:manipulation; overscroll-behavior:none;
  font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  color:var(--text-light);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
#app{position:fixed; inset:0; width:100%; height:100%; overflow:hidden;}

/* ============================
   PANTALLA INICIAL
   ============================ */
#splash{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:50;
  background:radial-gradient(circle at 50% 45%, #3a2410 0%, #150d05 45%, #05060f 80%);
  transition:opacity 1s ease, transform 1.2s ease; cursor:pointer;
}
#splash.fade-out{opacity:0; transform:scale(1.08); pointer-events:none;}
#splashTexto{
  font-size:5vw; color:var(--gold-soft); text-shadow:0 0 18px var(--glow), 0 0 40px #ff8c0055;
  margin-bottom:16px; font-weight:600; text-align:center; padding:0 10%;
}
#splashFlor{width:16vw; max-width:74px; min-width:48px; animation:pulse 1.7s ease-in-out infinite;}
@keyframes pulse{
  0%,100%{transform:scale(1); filter:drop-shadow(0 0 10px var(--glow));}
  50%{transform:scale(1.2); filter:drop-shadow(0 0 26px var(--glow));}
}

/* ============================
   CANVAS: PARTICULAS + BRILLO + CORAZON + CHISPAS
   ============================ */
#canvas{position:absolute; inset:0; width:100%; height:100%; z-index:5;}

/* ============================
   ESCENA PRINCIPAL
   ============================ */
#scene{position:absolute; inset:0; z-index:10;}

#titulo{
  position:absolute; top:5%; left:0; width:100%; text-align:center; padding:0 4%;
  opacity:0; transform:translateY(-14px); transition:opacity 1.4s ease, transform 1.4s ease; z-index:30;
}
#titulo.visible{opacity:1; transform:translateY(0);}
#tituloTexto{
  font-size:5.6vw; color:var(--gold); text-shadow:0 0 12px var(--glow), 0 0 30px #ffb14755;
  font-weight:700; margin:0; line-height:1.15;
}
#subtituloTexto{ font-size:2.9vw; color:var(--gold-soft); opacity:.85; margin-top:6px; text-shadow:0 0 8px var(--glow); }

/* Frase grande central (slideshow) */
#frase-grande{
  position:absolute; top:16%; left:50%; transform:translate(-50%,0);
  width:82%; text-align:center; z-index:28;
  font-size:4.1vw; color:var(--gold-soft); text-shadow:0 0 10px var(--glow);
  opacity:0; transition:opacity 1.1s ease; pointer-events:none; font-weight:600;
}
#frase-grande.visible{opacity:.95;}

/* Frases ambiente (marquee de fondo, discretas) */
#marquee-container{position:absolute; inset:0; z-index:8; opacity:0; transition:opacity 2s ease; pointer-events:none;}
#marquee-container.visible{opacity:1;}
.marquee-row{position:absolute; left:0; width:100%; white-space:nowrap; overflow:hidden; font-size:2.3vw; color:var(--text-light); opacity:.28;}
.marquee-track{display:inline-block; padding-left:100%; will-change:transform;}
.marquee-track span{margin-right:70px;}
.marquee-row.rtl .marquee-track{animation-direction:reverse;}

/* Girasoles */
#flowers-container{position:absolute; inset:0; z-index:20; pointer-events:none;}
.flor{
  position:absolute; opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-8deg);
  transition:opacity 1.6s ease, left 2.4s ease, top 2.4s ease, transform 1.6s ease;
  filter:drop-shadow(0 0 10px #ffb64766);
}
.flor.visible{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg);}
.flor.float{animation:floatFlor 6s ease-in-out infinite;}
@keyframes floatFlor{ 0%,100%{margin-top:0px;} 50%{margin-top:-12px;} }

/* Boton fijo (esquina) para abrir el mensaje */
#btn-mensaje{
  position:fixed; z-index:60; right:5%; bottom:calc(6% + env(safe-area-inset-bottom,0px));
  width:58px; height:58px; border-radius:50%; border:none;
  background:radial-gradient(circle at 40% 35%, var(--gold-soft), var(--gold-deep));
  box-shadow:0 0 18px var(--glow), 0 0 34px #ffb14766;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  opacity:0; transform:scale(.6); transition:opacity 1.2s ease, transform 1.2s ease;
  animation:pulse 2.2s ease-in-out infinite;
}
#btn-mensaje.visible{opacity:1; transform:scale(1);}
#btn-mensaje svg{width:26px; height:26px;}

/* Indicación de toque */
#tap-hint{
  position:absolute; bottom:calc(15% + env(safe-area-inset-bottom,0px)); left:0; width:100%; text-align:center;
  font-size:2.6vw; color:var(--gold-soft); opacity:0; z-index:25; text-shadow:0 0 8px var(--glow);
  transition:opacity 1.6s ease; pointer-events:none;
}
#tap-hint.visible{opacity:.75;}

/* ============================
   TARJETA / MODAL
   ============================ */
#modal-overlay{
  position:fixed; inset:0; z-index:80; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.6); opacity:0; pointer-events:none; transition:opacity .5s ease;
}
#modal-overlay.visible{opacity:1; pointer-events:auto;}
#modal-box{
  width:min(88vw, 420px); max-height:80vh; overflow-y:auto;
  background:var(--card-bg); border:1px solid var(--card-border); border-radius:16px;
  padding:26px 22px 22px; position:relative; box-shadow:0 0 40px #000a, 0 0 60px #ffb14733;
  transform:translateY(18px) scale(.96); transition:transform .5s ease;
}
#modal-overlay.visible #modal-box{transform:translateY(0) scale(1);}
#modal-titulo{ text-align:center; color:var(--gold); font-size:21px; margin:0 0 16px; text-shadow:0 0 10px var(--glow); }
#modal-mensaje p{font-size:15px; line-height:1.6; margin:0 0 14px; color:var(--text-light);}
#modal-close{
  position:absolute; top:10px; right:12px; width:34px; height:34px; border-radius:50%;
  background:transparent; border:1px solid var(--card-border); color:var(--gold-soft); font-size:18px; cursor:pointer;
}
</style>
</head>
<body>
<div id="app">

  <div id="splash">
    <div id="splashTexto"></div>
    <svg id="splashFlor" viewBox="0 0 100 100"></svg>
  </div>

  <canvas id="canvas"></canvas>

  <div id="scene">
    <div id="titulo">
      <div id="tituloTexto"></div>
      <div id="subtituloTexto"></div>
    </div>
    <div id="frase-grande"></div>
    <div id="flowers-container"></div>
    <div id="marquee-container"></div>
    <div id="tap-hint"></div>
  </div>

  <button id="btn-mensaje" aria-label="Ver mensaje">
    <svg viewBox="0 0 32 32"><path fill="#6b3f1d" d="M16 28s-11-7-11-15c0-4 3-7 7-7 2 0 4 1 4 3 0-2 2-3 4-3 4 0 7 3 7 7 0 8-11 15-11 15z"/></svg>
  </button>

  <div id="modal-overlay">
    <div id="modal-box">
      <button id="modal-close">×</button>
      <h2 id="modal-titulo"></h2>
      <div id="modal-mensaje"></div>
    </div>
  </div>

</div>

<script>
/* ==================================================
   TEXTOS EDITABLES
   Todo lo que aparece en pantalla está aquí.
   ================================================== */
const textos = {
  inicio: "Toca para comenzar",
  titulo: "Feliz Día de las Flores Amarillas",
  subtitulo: "Para mi mejor amiga 🌻",
  tapHint: "toca el girasol para tu mensaje",

  // Frases grandes que aparecen una por una en el centro
  frasesGrandes: [
    "Una amiga como tú no se encuentra dos veces",
    "Gracias por tantas risas juntos",
    "Tu amistad es de las cosas más bonitas que tengo",
    "Hoy es un buen día para recordarte lo especial que eres",
    "Que nunca falten días como este entre nosotros",
    "Contigo hasta lo simple se vuelve divertido",
    "Y PA CUANDO CRECES? jajaj"
    
  ],

  // Frases pequeñas de fondo (decorativas, se mueven en varias filas)
  frasesAmbiente: [
    "Gracias por estar siempre",
    "Amistad de las buenas",
    "Contigo todo es mejor",
    "Un girasol para ti",
    "Gracias por tanto apoyo",
    "Amigos para toda la vida", 
    "Que nunca falte tu amistad",
    "Un abrazo enviado con cariño"
  ],

  modalTitulo: "Para mi mejor amiga 💛",
  modalMensaje: [
    "Hay personas que llegan y, sin darse cuenta, hacen que muchos de tus días sean mejores. Así has sido tú para mí.",
    "Gracias por cada momento compartido, por las risas y por estar ahí incluso en lo simple. Quiero que sepas cuánto vales y cuánto significa tu amistad para mí.",
    "Que esta flor amarilla te recuerde, hoy y siempre, lo especial que eres como amiga."
  ]
};

/* ==================================================
   CONFIGURACIÓN
   ================================================== */
const CONFIG = {
  colorGold: "#ffd36b",
  colorGoldSoft: "#ffe9b0",
  colorGoldDeep: "#e8a13a",
  numParticulas: 80,     // baja este número si el celular va lento
  numFlores: 11,
  brilloCentral: 1.0,
  velocidadFlores: 1.0,
  duracionFraseGrande: 3200 // ms que dura cada frase grande en pantalla
};

const $ = (sel) => document.querySelector(sel);
const rand = (a,b) => a + Math.random()*(b-a);

/* ==================================================
   FLOR EN SVG (sin imágenes externas)
   ================================================== */
function svgGirasol(opts){
  const c1 = opts.c1 || CONFIG.colorGold, c2 = opts.c2 || CONFIG.colorGoldDeep;
  let petals = "";
  for(let i=0;i<12;i++){
    petals += `<ellipse cx="50" cy="20" rx="7" ry="16" fill="${i%2===0?c1:c2}" transform="rotate(${(360/12)*i} 50 50)"/>`;
  }
  return `<svg viewBox="0 0 100 120" width="${opts.size}" height="${opts.size*1.2}">
    <line x1="50" y1="66" x2="50" y2="112" stroke="#3f7d3a" stroke-width="4"/>
    <ellipse cx="38" cy="90" rx="10" ry="4" fill="#3f7d3a" transform="rotate(-20 38 90)"/>
    <g>${petals}</g>
    <circle cx="50" cy="50" r="16" fill="#6b3f1d"/>
  </svg>`;
}
function pintarFlorSplash(){
  const svg = $("#splashFlor");
  let petals = "";
  for(let i=0;i<10;i++) petals += `<ellipse cx="50" cy="26" rx="8" ry="18" fill="${CONFIG.colorGold}" transform="rotate(${i*36} 50 50)"/>`;
  svg.innerHTML = `<g>${petals}</g><circle cx="50" cy="50" r="14" fill="#6b3f1d"/>`;
}

/* ==================================================
   CANVAS: fondo, brillo, corazón, partículas y chispas
   ================================================== */
const canvas = $("#canvas"), ctx = canvas.getContext("2d");
let W,H,cx,cy;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; cx=W*0.5; cy=H*0.42; }
addEventListener("resize", resize); resize();

let intensidadGlow = 0.3, targetGlow = 0.3;
let heartProgress = 0, targetHeartProgress = 0; // 0 a 1: dibuja el corazón progresivamente

class Particula{
  constructor(){ this.reset(true); }
  reset(inicial){
    this.x = rand(0,W); this.y = inicial ? rand(0,H) : H+rand(0,40);
    this.r = rand(0.6,2.4); this.speed = rand(0.07,0.3);
    this.alpha = rand(0.12,0.85); this.tw = rand(0,Math.PI*2); this.twSpeed = rand(0.01,0.03);
  }
  update(){ this.y -= this.speed; this.tw += this.twSpeed; if(this.y<-10) this.reset(false); }
  draw(){
    const a = this.alpha*(0.5+0.5*Math.sin(this.tw));
    ctx.beginPath(); ctx.fillStyle = `rgba(255,214,140,${a})`;
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
  }
}
const particulas = Array.from({length:CONFIG.numParticulas}, () => new Particula());

/* Chispas: caen desde la punta del corazón como una fuente/abanico */
class Chispa{
  constructor(origX, origY){ this.reset(origX,origY); }
  reset(origX,origY){
    this.ox=origX; this.oy=origY;
    this.ang = rand(Math.PI*0.15, Math.PI*0.85); // hacia abajo en abanico
    this.speed = rand(0.8,2.2);
    this.life = 0; this.maxLife = rand(60,140);
    this.size = rand(0.8,2.2);
    this.curve = rand(-0.02,0.02);
  }
  update(){
    this.life++;
    this.ox += Math.cos(this.ang)*this.speed*0.6;
    this.oy += Math.sin(this.ang)*this.speed*0.9 + this.life*0.01;
    this.ang += this.curve;
    if(this.life > this.maxLife) this.reset(cx, cy+H*0.02);
  }
  draw(){
    const a = Math.max(0, 1 - this.life/this.maxLife);
    ctx.beginPath(); ctx.fillStyle = `rgba(255,225,160,${a*0.8})`;
    ctx.arc(this.ox,this.oy,this.size,0,Math.PI*2); ctx.fill();
  }
}
let chispas = [];
function iniciarChispas(){
  for(let i=0;i<70;i++) chispas.push(new Chispa(cx, cy+H*0.02));
}

/* Explosion (burst) al tocar el boton de mensaje */
let burst = [];
function lanzarBurst(){
  for(let i=0;i<90;i++){
    const ang = rand(0,Math.PI*2), speed = rand(1.5,5.5);
    burst.push({
      x:cx, y:cy, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed - 1.5,
      life:0, maxLife:rand(40,80), size:rand(1,3)
    });
  }
}
function actualizarBurst(){
  burst.forEach(p=>{
    p.life++; p.x+=p.vx; p.y+=p.vy; p.vy += 0.04; p.vx *= 0.98;
    const a = Math.max(0, 1-p.life/p.maxLife);
    ctx.beginPath(); ctx.fillStyle = `rgba(255,214,120,${a})`;
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  });
  burst = burst.filter(p=>p.life < p.maxLife);
}

/* Corazón dibujado con trazo dorado brillante (progresivo) */
function heartPath(t){
  // devuelve puntos del contorno del corazón hasta el progreso t (0..1)
  const pts = [];
  const N = 200, n = Math.floor(N*t);
  for(let i=0;i<=n;i++){
    const a = (i/N) * Math.PI*2;
    const x = 16*Math.pow(Math.sin(a),3);
    const y = -(13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a));
    pts.push([x,y]);
  }
  return pts;
}
function dibujarCorazon(){
  if(heartProgress<=0) return;
  const scale = Math.min(W,H)*0.011;
  const pts = heartPath(heartProgress);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.beginPath();
  pts.forEach(([x,y],i)=>{
    const px = x*scale, py = y*scale;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.strokeStyle = "rgba(255,214,130,0.9)";
  ctx.lineWidth = 3;
  ctx.shadowColor = "#ffcf70";
  ctx.shadowBlur = 18;
  ctx.stroke();
  ctx.restore();
}

function dibujarGlowCentral(){
  const radio = Math.max(W,H)*0.42*intensidadGlow*CONFIG.brilloCentral;
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,radio);
  grad.addColorStop(0, `rgba(255,230,170,${0.55*intensidadGlow})`);
  grad.addColorStop(0.35, `rgba(255,190,90,${0.28*intensidadGlow})`);
  grad.addColorStop(1, "rgba(255,180,70,0)");
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
}

let chispasActivas = false;
function loop(){
  ctx.clearRect(0,0,W,H);
  intensidadGlow += (targetGlow-intensidadGlow)*0.03;
  heartProgress += (targetHeartProgress-heartProgress)*0.04;
  dibujarGlowCentral();
  dibujarCorazon();
  particulas.forEach(p=>{p.update(); p.draw();});
  if(chispasActivas) chispas.forEach(c=>{c.update(); c.draw();});
  if(burst.length) actualizarBurst();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ==================================================
   FLORES: aparecen dispersas y luego forman un círculo
   ================================================== */
let florDivs = [];
function construirFlores(){
  const cont = $("#flowers-container");
  for(let i=0;i<CONFIG.numFlores;i++){
    const div = document.createElement("div");
    div.className = "flor";
    const sx = rand(6,94), sy = rand(10,90);
    div.style.left = sx+"%"; div.style.top = sy+"%";
    const size = rand(34,64);
    div.innerHTML = svgGirasol({size, c1: Math.random()>0.5?CONFIG.colorGold:CONFIG.colorGoldSoft, c2:CONFIG.colorGoldDeep});
    cont.appendChild(div);
    florDivs.push(div);
    setTimeout(()=>{
      div.classList.add("visible");
      div.style.animationDelay = rand(0,3)+"s";
      div.style.animationDuration = (6/CONFIG.velocidadFlores)+"s";
      div.classList.add("float");
    }, 250 + i*180);
  }
}
function acomodarFloresEnCirculo(){
  const cxp = 50, cyp = 42, rx = 34, ry = 22;
  florDivs.forEach((div,i)=>{
    const ang = (Math.PI*2/florDivs.length)*i;
    const px = cxp + Math.cos(ang)*rx;
    const py = cyp + Math.sin(ang)*ry + 10;
    setTimeout(()=>{ div.style.left = px+"%"; div.style.top = py+"%"; }, i*70);
  });
}

/* ==================================================
   FRASES DE FONDO (marquee) Y FRASE GRANDE CENTRAL
   ================================================== */
function construirMarquee(){
  const cont = $("#marquee-container");
  const filas = textos.frasesAmbiente;
  filas.forEach((frase,i)=>{
    const row = document.createElement("div");
    row.className = "marquee-row"+(i%2===0?"":" rtl");
    row.style.top = (8 + i*(82/filas.length)) + "%";
    const dur = rand(26,55);
    const track = document.createElement("div");
    track.className = "marquee-track";
    track.style.animation = `scrollLeft ${dur}s linear infinite`;
    track.innerHTML = `<span>❀ ${frase}</span><span>❀ ${frase}</span><span>❀ ${frase}</span>`;
    row.appendChild(track);
    cont.appendChild(row);
  });
  const styleTag = document.createElement("style");
  styleTag.innerHTML = `@keyframes scrollLeft{ from{transform:translateX(0);} to{transform:translateX(-100%);} }`;
  document.head.appendChild(styleTag);
}

let fraseIdx = 0, fraseTimer = null;
function iniciarFraseGrande(){
  const el = $("#frase-grande");
  function mostrar(){
    el.classList.remove("visible");
    setTimeout(()=>{
      el.textContent = textos.frasesGrandes[fraseIdx % textos.frasesGrandes.length];
      fraseIdx++;
      el.classList.add("visible");
    }, 500);
  }
  mostrar();
  fraseTimer = setInterval(mostrar, CONFIG.duracionFraseGrande);
}

function llenarTextosFijos(){
  $("#splashTexto").textContent = textos.inicio;
  $("#tituloTexto").textContent = textos.titulo;
  $("#subtituloTexto").textContent = textos.subtitulo;
  $("#tap-hint").textContent = textos.tapHint;
  $("#modal-titulo").textContent = textos.modalTitulo;
  $("#modal-mensaje").innerHTML = textos.modalMensaje.map(p=>`<p>${p}</p>`).join("");
}

/* ==================================================
   SECUENCIA DE FASES
   ================================================== */
let iniciado = false;
function iniciarExperiencia(){
  if(iniciado) return; iniciado = true;

  $("#splash").classList.add("fade-out");
  setTimeout(()=>{ $("#splash").style.display = "none"; }, 1100);

  targetGlow = 1.0;

  setTimeout(()=> $("#titulo").classList.add("visible"), 500);
  setTimeout(construirFlores, 700);

  setTimeout(()=>{ targetHeartProgress = 1; }, 1400);
  setTimeout(()=>{ chispasActivas = true; iniciarChispas(); }, 2000);

  setTimeout(()=>{
    construirMarquee();
    $("#marquee-container").classList.add("visible");
  }, 1800);

  setTimeout(iniciarFraseGrande, 2600);
  setTimeout(acomodarFloresEnCirculo, 3200);

  setTimeout(()=>{
    $("#btn-mensaje").classList.add("visible");
    $("#tap-hint").classList.add("visible");
  }, 4600);
}

/* ==================================================
   INTERACCIÓN
   ================================================== */
function abrirModal(){
  lanzarBurst();
  setTimeout(()=> $("#modal-overlay").classList.add("visible"), 380);
}
function cerrarModal(){ $("#modal-overlay").classList.remove("visible"); }

$("#splash").addEventListener("click", iniciarExperiencia);
$("#splash").addEventListener("touchend", (e)=>{ e.preventDefault(); iniciarExperiencia(); }, {passive:false});

$("#btn-mensaje").addEventListener("click", (e)=>{ e.stopPropagation(); abrirModal(); });
$("#modal-close").addEventListener("click", (e)=>{ e.stopPropagation(); cerrarModal(); });
$("#modal-overlay").addEventListener("click", (e)=>{ if(e.target === $("#modal-overlay")) cerrarModal(); });

/* ==================================================
   INICIO
   ================================================== */
llenarTextosFijos();
pintarFlorSplash();
</script>
</body>
</html>
